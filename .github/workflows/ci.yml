name: Continuous Integration
on: 
  workflow_dispatch:
  push:
    branches:
     - master
     - 1.9
  pull_request:
    branches:
     - master
     - 1.9
jobs:
  test:
    strategy:
      matrix:
        include:
          # - os: ubuntu-latest
          #   os_short: linux
          #   compiler_cc: gcc
          #   compiler_cxx: g++
          # - os: ubuntu-latest
          #   os_short: linux
          #   compiler_cc: clang
          #   compiler_cxx: clang++
          - os: ubuntu-22.04
            os_short: linux
            compiler_cc: clang-11
            compiler_cxx: clang++-11
          - os: ubuntu-22.04
            os_short: linux
            compiler_cc: gcc-9
            compiler_cxx: g++-9
            compiler_install: 'gcc-9-multilib g++-9-multilib'
          - os: windows-2022
            os_short: windows
            compiler_cc: msvc
      fail-fast: false
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os_short }}-${{ matrix.compiler_cc }}
    env:
      DEPENDENCIES_FOLDER: dependencies      
      DEPENDENCIES_ROOT: ${{ github.workspace }}/dependencies      
      DEPENDENCIES_ROOT_WIN: ${{ github.workspace }}\dependencies              
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          path: amxmodx
      # Setup Python for AMBuild
      - uses: actions/setup-python@v2
        name: Setup Python 3.9
        with:
          python-version: 3.9
      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip setuptools wheel
          python3 --version
      - name: Install AMXModX dependencies (Linux)
        if: startsWith(runner.os, 'Linux')
        shell: bash
        run: |
          mkdir -p ${{ env.DEPENDENCIES_FOLDER }}
          cd ${{ env.DEPENDENCIES_FOLDER }}
          
          # Satisfy checkout-deps requirement for a "amxmodx" folder.
          mkdir -p amxmodx
          ../amxmodx/support/checkout-deps.sh          
      - name: Install AMXModX dependencies (Windows)
        if: startsWith(runner.os, 'Windows')
        shell: cmd
        run: |
          mkdir %DEPENDENCIES_ROOT_WIN%\nasm
          curl -L -o "%DEPENDENCIES_ROOT_WIN%\nasm\nasm.zip" https://www.nasm.us/pub/nasm/releasebuilds/2.13.03/win32/nasm-2.13.03-win32.zip
          chdir %DEPENDENCIES_ROOT_WIN%\nasm
          7z x nasm.zip
          
          chdir %DEPENDENCIES_ROOT_WIN%
          git clone https://github.com/alliedmodders/ambuild
          git clone https://github.com/alliedmodders/metamod-hl1 metamod-am
          git clone https://github.com/alliedmodders/hlsdk
          
          curl -L -o "mysql-connector-c-6.1.1-win32.zip" https://downloads.mysql.com/archives/get/p/19/file/mysql-connector-c-6.1.1-win32.zip
          7z x mysql-connector-c-6.1.1-win32.zip -o"mysql"
          cd mysql
          dir
          ren mysql-connector-c-6.1.1-win32 mysql-5.5
          move /Y mysql-5.5 ..\
          
          cd ..\ambuild
          python3 setup.py install          
      - name: Install Linux dependencies
        if: startsWith(runner.os, 'Linux')
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-multilib g++-multilib libstdc++6 lib32stdc++6 \
            libc6-dev libc6-dev-i386 linux-libc-dev \
            linux-libc-dev:i386 lib32z1-dev nasm ${{ matrix.compiler_cc }} ${{ matrix.compiler_install }}
      - name: Select compiler
        if: startsWith(runner.os, 'Linux')
        run: |
          echo "CC=${{ matrix.compiler_cc }}" >> $GITHUB_ENV
          echo "CXX=${{ matrix.compiler_cxx }}" >> $GITHUB_ENV
          ${{ matrix.compiler_cc }} --version
          ${{ matrix.compiler_cxx }} --version
      - uses: ilammy/setup-nasm@v1
      - name: Build Linux
        if: startsWith(runner.os, 'Linux')
        working-directory: amxmodx
        run: |
          mkdir build
          cd build
          python3 ../configure.py --enable-optimize --metamod=${{ env.DEPENDENCIES_ROOT }}/metamod-am --hlsdk=${{ env.DEPENDENCIES_ROOT }}/hlsdk --mysql=${{ env.DEPENDENCIES_ROOT }}/mysql-5.5
          ambuild
      - name: Upload Linux artifacts
        if: startsWith(runner.os, 'Linux') && always()
        uses: actions/upload-artifact@v4
        with:
          name: amxmodx-${{ matrix.os_short }}-${{ matrix.compiler_cc }}-${{ github.sha }}
          path: amxmodx/build/packages/
          retention-days: 7
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86
      - name: Build Windows
        if: startsWith(runner.os, 'Windows')
        working-directory: amxmodx
        shell: cmd
        run: |
          cl.exe
          mkdir build
          cd build
          python3 ../configure.py --enable-optimize --metamod=${{ env.DEPENDENCIES_ROOT_WIN }}\metamod-am --hlsdk=${{ env.DEPENDENCIES_ROOT_WIN }}\hlsdk --mysql=${{ env.DEPENDENCIES_ROOT_WIN }}\mysql-5.5
          ambuild
      - name: Upload Windows artifacts
        if: startsWith(runner.os, 'Windows') && always()
        uses: actions/upload-artifact@v4
        with:
          name: amxmodx-${{ matrix.os_short }}-${{ matrix.compiler_cc }}-${{ github.sha }}
          path: amxmodx/build/packages/
          retention-days: 7

  release:
    name: Create Release
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/1.9')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Get version info
        id: version
        run: |
          VERSION=$(cat product.version | tr -d '[:space:]')
          GITREF=$(cat ref.version | tr -d '[:space:]')
          GIT_COUNT=$(git rev-list --count 0f892fc5fb647fcdd995931bd47d6d2e3a4807c5..HEAD)
          DATE=$(date +%Y%m%d)
          TAG_NAME="v${VERSION}-${GITREF}-xash-${DATE}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "gitref=$GITREF" >> $GITHUB_OUTPUT
          echo "git_count=$GIT_COUNT" >> $GITHUB_OUTPUT
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "Version: $VERSION, Git: $GIT_COUNT, Tag: $TAG_NAME"

      - name: Create release packages
        run: |
          mkdir -p output
          VERSION="${{ steps.version.outputs.version }}"
          GITREF="${{ steps.version.outputs.gitref }}"
          GIT_COUNT="${{ steps.version.outputs.git_count }}"

          # Função para obter plataforma do nome do artifact
          get_platform() {
            case "$1" in
              *-windows-*) echo "windows" ;;
              *-linux-gcc-*) echo "linux-gcc" ;;
              *-linux-clang-*) echo "linux-clang" ;;
              *) echo "unknown" ;;
            esac
          }

          # Processar cada artifact
          for artifact_dir in artifacts/amxmodx-*/; do
            [ -d "$artifact_dir" ] || continue

            artifact_name=$(basename "$artifact_dir")
            platform=$(get_platform "$artifact_name")
            echo "Processando: $artifact_name (plataforma: $platform)"

            # Para cada subpasta (base, cstrike, etc.)
            for subfolder in "$artifact_dir"/*/; do
              [ -d "$subfolder" ] || continue

              subname=$(basename "$subfolder")

              if [[ "$platform" == "windows" ]]; then
                outname="amxmodx-${VERSION}-${GITREF}-xash-git${GIT_COUNT}-${subname}-${platform}.zip"
                echo "  Criando: $outname"
                (cd "$subfolder" && zip -rq "$GITHUB_WORKSPACE/output/$outname" .)
              else
                outname="amxmodx-${VERSION}-${GITREF}-xash-git${GIT_COUNT}-${subname}-${platform}.tar.gz"
                echo "  Criando: $outname"
                (cd "$subfolder" && tar -czf "$GITHUB_WORKSPACE/output/$outname" .)
              fi
            done
          done

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          name: ${{ steps.version.outputs.tag_name }}
          draft: false
          prerelease: ${{ github.ref == 'refs/heads/1.9' }}
          files: |
            output/*.zip
            output/*.tar.gz
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
